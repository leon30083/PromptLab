<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptLab 模型管理中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .nav-tabs {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .nav-tab {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #64748b;
            transition: all 0.3s ease;
        }

        .nav-tab.active {
            background: white;
            color: #4f46e5;
            border-bottom: 3px solid #4f46e5;
        }

        .nav-tab:hover {
            background: #f1f5f9;
            color: #4f46e5;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #4f46e5;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #1e293b;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #64748b;
            font-size: 0.9rem;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .model-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .model-card.enabled {
            border-left: 4px solid #10b981;
        }

        .model-card.disabled {
            border-left: 4px solid #ef4444;
            opacity: 0.7;
        }

        .model-card.current {
            border: 2px solid #4f46e5;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%);
        }

        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .model-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
        }

        .model-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-enabled {
            background: #dcfce7;
            color: #166534;
        }

        .status-disabled {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-current {
            background: #dbeafe;
            color: #1e40af;
        }

        .model-info {
            margin-bottom: 15px;
        }

        .model-info p {
            margin: 5px 0;
            color: #64748b;
            font-size: 0.9rem;
        }

        .model-info strong {
            color: #1e293b;
        }

        .model-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag {
            background: #f1f5f9;
            color: #475569;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .model-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .add-model-form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .performance-chart {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        @media (max-width: 768px) {
            .nav-tabs {
                flex-direction: column;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .models-grid {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 PromptLab 模型管理中心</h1>
            <p>集中管理和监控您的AI模型配置</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('overview')">📊 概览</button>
            <button class="nav-tab" onclick="showTab('models')">🤖 模型管理</button>
            <button class="nav-tab" onclick="showTab('add-model')">➕ 添加模型</button>
            <button class="nav-tab" onclick="showTab('performance')">📈 性能监控</button>
            <button class="nav-tab" onclick="showTab('settings')">⚙️ 设置</button>
        </div>

        <div class="content">
            <!-- 概览标签页 -->
            <div id="overview" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>总模型数</h3>
                        <div class="value" id="total-models">-</div>
                        <div class="label">已配置模型</div>
                    </div>
                    <div class="stat-card">
                        <h3>启用模型</h3>
                        <div class="value" id="enabled-models">-</div>
                        <div class="label">可用模型</div>
                    </div>
                    <div class="stat-card">
                        <h3>当前模型</h3>
                        <div class="value" id="current-model">-</div>
                        <div class="label">正在使用</div>
                    </div>
                    <div class="stat-card">
                        <h3>今日请求</h3>
                        <div class="value" id="daily-requests">-</div>
                        <div class="label">API调用次数</div>
                    </div>
                </div>

                <div class="performance-chart">
                    <div class="chart-header">
                        <h3 class="chart-title">模型使用分布</h3>
                        <button class="btn btn-secondary" onclick="refreshData()">🔄 刷新</button>
                    </div>
                    <div id="usage-chart">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载数据中...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 模型管理标签页 -->
            <div id="models" class="tab-content">
                <div class="models-grid" id="models-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>加载模型列表中...</p>
                    </div>
                </div>
            </div>

            <!-- 添加模型标签页 -->
            <div id="add-model" class="tab-content">
                <div class="add-model-form">
                    <h2 style="margin-bottom: 20px; color: #1e293b;">添加新模型</h2>
                    <form id="add-model-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="model-name">模型名称 *</label>
                                <input type="text" id="model-name" name="name" required placeholder="例如: gpt-4o">
                            </div>
                            <div class="form-group">
                                <label for="model-provider">提供商 *</label>
                                <select id="model-provider" name="provider" required>
                                    <option value="">选择提供商</option>
                                    <option value="openai">OpenAI</option>
                                    <option value="openai_compatible">OpenAI兼容</option>
                                    <option value="anthropic">Anthropic</option>
                                    <option value="google_vertex">Google Vertex AI</option>
                                    <option value="ollama">Ollama</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="model-id">模型ID *</label>
                                <input type="text" id="model-id" name="model_id" required placeholder="例如: gpt-4o">
                            </div>
                            <div class="form-group">
                                <label for="api-base">API基础URL</label>
                                <input type="url" id="api-base" name="api_base" placeholder="例如: https://api.openai.com/v1">
                            </div>
                            <div class="form-group">
                                <label for="api-key">API密钥</label>
                                <input type="password" id="api-key" name="api_key" placeholder="输入API密钥">
                            </div>
                            <div class="form-group">
                                <label for="temperature">温度参数</label>
                                <input type="number" id="temperature" name="temperature" min="0" max="2" step="0.1" value="0.7">
                            </div>
                            <div class="form-group">
                                <label for="max-tokens">最大Token数</label>
                                <input type="number" id="max-tokens" name="max_tokens" min="1" placeholder="例如: 4096">
                            </div>
                            <div class="form-group">
                                <label for="priority">优先级</label>
                                <input type="number" id="priority" name="priority" min="1" max="10" value="5">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="description">描述</label>
                            <textarea id="description" name="description" rows="3" placeholder="模型描述信息"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">➕ 添加模型</button>
                    </form>
                </div>
            </div>

            <!-- 性能监控标签页 -->
            <div id="performance" class="tab-content">
                <div class="performance-chart">
                    <div class="chart-header">
                        <h3 class="chart-title">响应时间趋势</h3>
                        <select id="time-range">
                            <option value="1h">最近1小时</option>
                            <option value="24h" selected>最近24小时</option>
                            <option value="7d">最近7天</option>
                            <option value="30d">最近30天</option>
                        </select>
                    </div>
                    <div id="response-time-chart">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载性能数据中...</p>
                        </div>
                    </div>
                </div>

                <div class="performance-chart">
                    <div class="chart-header">
                        <h3 class="chart-title">成本统计</h3>
                        <button class="btn btn-secondary" onclick="exportCostReport()">📊 导出报告</button>
                    </div>
                    <div id="cost-chart">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载成本数据中...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 设置标签页 -->
            <div id="settings" class="tab-content">
                <div class="add-model-form">
                    <h2 style="margin-bottom: 20px; color: #1e293b;">系统设置</h2>
                    <form id="settings-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="default-timeout">默认超时时间（秒）</label>
                                <input type="number" id="default-timeout" name="default_timeout" value="30" min="5" max="300">
                            </div>
                            <div class="form-group">
                                <label for="retry-attempts">重试次数</label>
                                <input type="number" id="retry-attempts" name="retry_attempts" value="3" min="0" max="10">
                            </div>
                            <div class="form-group">
                                <label for="cache-ttl">缓存时间（秒）</label>
                                <input type="number" id="cache-ttl" name="cache_ttl" value="300" min="0" max="3600">
                            </div>
                            <div class="form-group">
                                <label for="daily-limit">每日成本限制（美元）</label>
                                <input type="number" id="daily-limit" name="daily_limit" value="10" min="0" step="0.01">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="enable-cache" name="enable_cache" checked>
                                启用查询缓存
                            </label>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="enable-monitoring" name="enable_monitoring" checked>
                                启用性能监控
                            </label>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="enable-failover" name="enable_failover" checked>
                                启用故障转移
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary">💾 保存设置</button>
                        <button type="button" class="btn btn-danger" onclick="clearAllCache()">🗑️ 清除缓存</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // 全局变量
        let modelsData = [];
        let performanceData = {};
        let currentTab = 'overview';

        // 标签页切换
        function showTab(tabName) {
            // 隐藏所有标签页内容
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 移除所有标签的active类
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 显示选中的标签页
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            currentTab = tabName;
            
            // 根据标签页加载相应数据
            switch(tabName) {
                case 'overview':
                    loadOverviewData();
                    break;
                case 'models':
                    loadModelsData();
                    break;
                case 'performance':
                    loadPerformanceData();
                    break;
            }
        }

        // 加载概览数据
        async function loadOverviewData() {
            try {
                // 模拟API调用
                const stats = await mockApiCall('/api/stats');
                
                document.getElementById('total-models').textContent = stats.totalModels || '12';
                document.getElementById('enabled-models').textContent = stats.enabledModels || '8';
                document.getElementById('current-model').textContent = stats.currentModel || 'gemini-2.5-pro';
                document.getElementById('daily-requests').textContent = stats.dailyRequests || '156';
                
                // 加载使用图表
                loadUsageChart();
            } catch (error) {
                console.error('加载概览数据失败:', error);
            }
        }

        // 加载模型数据
        async function loadModelsData() {
            try {
                const modelsGrid = document.getElementById('models-grid');
                modelsGrid.innerHTML = '<div class="loading"><div class="spinner"></div><p>加载模型列表中...</p></div>';
                
                // 模拟API调用
                modelsData = await mockApiCall('/api/models');
                
                renderModelsGrid(modelsData);
            } catch (error) {
                console.error('加载模型数据失败:', error);
                document.getElementById('models-grid').innerHTML = '<div class="alert alert-error">加载模型数据失败</div>';
            }
        }

        // 渲染模型网格
        function renderModelsGrid(models) {
            const modelsGrid = document.getElementById('models-grid');
            
            if (!models || models.length === 0) {
                modelsGrid.innerHTML = '<div class="alert alert-warning">暂无模型配置</div>';
                return;
            }
            
            const modelsHtml = models.map(model => {
                const statusClass = model.enabled ? 'enabled' : 'disabled';
                const statusText = model.enabled ? '已启用' : '已禁用';
                const statusBadge = model.enabled ? 'status-enabled' : 'status-disabled';
                const currentClass = model.isCurrent ? 'current' : '';
                
                return `
                    <div class="model-card ${statusClass} ${currentClass}">
                        <div class="model-header">
                            <div class="model-name">${model.name}</div>
                            <div class="model-status ${statusBadge}">
                                ${model.isCurrent ? '当前' : statusText}
                            </div>
                        </div>
                        <div class="model-info">
                            <p><strong>提供商:</strong> ${model.provider}</p>
                            <p><strong>模型ID:</strong> ${model.model_id}</p>
                            <p><strong>优先级:</strong> ${model.priority}/10</p>
                            <p><strong>温度:</strong> ${model.temperature}</p>
                            ${model.max_tokens ? `<p><strong>最大Token:</strong> ${model.max_tokens}</p>` : ''}
                        </div>
                        ${model.tags ? `
                            <div class="model-tags">
                                ${model.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        ` : ''}
                        <div class="model-actions">
                            ${!model.isCurrent ? `<button class="btn btn-primary" onclick="switchModel('${model.name}')">切换</button>` : ''}
                            <button class="btn ${model.enabled ? 'btn-danger' : 'btn-success'}" onclick="toggleModel('${model.name}')">
                                ${model.enabled ? '禁用' : '启用'}
                            </button>
                            <button class="btn btn-secondary" onclick="editModel('${model.name}')">编辑</button>
                            <button class="btn btn-danger" onclick="deleteModel('${model.name}')">删除</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            modelsGrid.innerHTML = modelsHtml;
        }

        // 加载性能数据
        async function loadPerformanceData() {
            try {
                performanceData = await mockApiCall('/api/performance');
                renderPerformanceCharts();
            } catch (error) {
                console.error('加载性能数据失败:', error);
            }
        }

        // 渲染性能图表
        function renderPerformanceCharts() {
            // 响应时间图表
            const responseTimeChart = document.getElementById('response-time-chart');
            responseTimeChart.innerHTML = `
                <div style="text-align: center; padding: 40px; color: #64748b;">
                    <p>📈 响应时间趋势图</p>
                    <p>平均响应时间: 2.3秒</p>
                    <p>最快响应: 0.8秒</p>
                    <p>最慢响应: 8.5秒</p>
                </div>
            `;
            
            // 成本图表
            const costChart = document.getElementById('cost-chart');
            costChart.innerHTML = `
                <div style="text-align: center; padding: 40px; color: #64748b;">
                    <p>💰 成本统计</p>
                    <p>今日成本: $2.45</p>
                    <p>本月成本: $67.89</p>
                    <p>预计月成本: $89.12</p>
                </div>
            `;
        }

        // 加载使用图表
        function loadUsageChart() {
            const usageChart = document.getElementById('usage-chart');
            usageChart.innerHTML = `
                <div style="text-align: center; padding: 40px; color: #64748b;">
                    <p>📊 模型使用分布</p>
                    <p>Gemini 2.5 Pro: 45%</p>
                    <p>GPT-4o: 25%</p>
                    <p>Claude 3.5 Sonnet: 20%</p>
                    <p>其他: 10%</p>
                </div>
            `;
        }

        // 模型操作函数
        async function switchModel(modelName) {
            try {
                await mockApiCall(`/api/models/${modelName}/switch`, 'POST');
                showAlert('success', `已切换到模型: ${modelName}`);
                loadModelsData();
                loadOverviewData();
            } catch (error) {
                showAlert('error', `切换模型失败: ${error.message}`);
            }
        }

        async function toggleModel(modelName) {
            try {
                await mockApiCall(`/api/models/${modelName}/toggle`, 'POST');
                showAlert('success', `模型状态已更新: ${modelName}`);
                loadModelsData();
            } catch (error) {
                showAlert('error', `更新模型状态失败: ${error.message}`);
            }
        }

        function editModel(modelName) {
            const model = modelsData.find(m => m.name === modelName);
            if (!model) return;
            
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <h2>编辑模型: ${modelName}</h2>
                <form id="edit-model-form">
                    <div class="form-group">
                        <label>API密钥</label>
                        <input type="password" name="api_key" value="${model.api_key || ''}">
                    </div>
                    <div class="form-group">
                        <label>温度参数</label>
                        <input type="number" name="temperature" value="${model.temperature}" min="0" max="2" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>最大Token数</label>
                        <input type="number" name="max_tokens" value="${model.max_tokens || ''}">
                    </div>
                    <div class="form-group">
                        <label>优先级</label>
                        <input type="number" name="priority" value="${model.priority}" min="1" max="10">
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                </form>
            `;
            
            document.getElementById('modal').style.display = 'block';
            
            document.getElementById('edit-model-form').onsubmit = async (e) => {
                e.preventDefault();
                try {
                    const formData = new FormData(e.target);
                    await mockApiCall(`/api/models/${modelName}`, 'PUT', Object.fromEntries(formData));
                    showAlert('success', `模型 ${modelName} 已更新`);
                    closeModal();
                    loadModelsData();
                } catch (error) {
                    showAlert('error', `更新模型失败: ${error.message}`);
                }
            };
        }

        async function deleteModel(modelName) {
            if (!confirm(`确定要删除模型 ${modelName} 吗？`)) return;
            
            try {
                await mockApiCall(`/api/models/${modelName}`, 'DELETE');
                showAlert('success', `模型 ${modelName} 已删除`);
                loadModelsData();
                loadOverviewData();
            } catch (error) {
                showAlert('error', `删除模型失败: ${error.message}`);
            }
        }

        // 添加模型表单处理
        document.getElementById('add-model-form').onsubmit = async (e) => {
            e.preventDefault();
            
            try {
                const formData = new FormData(e.target);
                const modelData = Object.fromEntries(formData);
                
                await mockApiCall('/api/models', 'POST', modelData);
                showAlert('success', `模型 ${modelData.name} 已添加`);
                e.target.reset();
                loadModelsData();
                loadOverviewData();
            } catch (error) {
                showAlert('error', `添加模型失败: ${error.message}`);
            }
        };

        // 设置表单处理
        document.getElementById('settings-form').onsubmit = async (e) => {
            e.preventDefault();
            
            try {
                const formData = new FormData(e.target);
                const settings = Object.fromEntries(formData);
                
                await mockApiCall('/api/settings', 'PUT', settings);
                showAlert('success', '设置已保存');
            } catch (error) {
                showAlert('error', `保存设置失败: ${error.message}`);
            }
        };

        // 工具函数
        function showAlert(type, message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            const content = document.querySelector('.content');
            content.insertBefore(alertDiv, content.firstChild);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function refreshData() {
            switch(currentTab) {
                case 'overview':
                    loadOverviewData();
                    break;
                case 'models':
                    loadModelsData();
                    break;
                case 'performance':
                    loadPerformanceData();
                    break;
            }
        }

        async function clearAllCache() {
            if (!confirm('确定要清除所有缓存吗？')) return;
            
            try {
                await mockApiCall('/api/cache/clear', 'POST');
                showAlert('success', '缓存已清除');
            } catch (error) {
                showAlert('error', `清除缓存失败: ${error.message}`);
            }
        }

        function exportCostReport() {
            // 模拟导出功能
            showAlert('success', '成本报告已导出到下载文件夹');
        }

        // 模拟API调用
        async function mockApiCall(url, method = 'GET', data = null) {
            // 模拟网络延迟
            await new Promise(resolve => setTimeout(resolve, 500 + Math.random() * 1000));
            
            // 模拟数据
            if (url === '/api/stats') {
                return {
                    totalModels: 12,
                    enabledModels: 8,
                    currentModel: 'gemini-2.5-pro',
                    dailyRequests: 156
                };
            }
            
            if (url === '/api/models') {
                return [
                    {
                        name: 'gemini-2.5-pro',
                        provider: 'google_vertex',
                        model_id: 'gemini-2.5-pro',

                        temperature: 0.7,
                        max_tokens: 8192,
                        tags: ['multimodal', 'reasoning', 'coding']
                    },
                    {
                        name: 'gpt-4o',
                        provider: 'openai',
                        model_id: 'gpt-4o',

                        isCurrent: false,
                        priority: 9,
                        temperature: 0.7,
                        max_tokens: 4096,
                        tags: ['reasoning', 'coding', 'multimodal']
                    },
                    {
                        name: 'claude-3.5-sonnet',
                        provider: 'anthropic',
                        model_id: 'claude-3-5-sonnet-20241022',
                        enabled: true,
                        isCurrent: false,
                        priority: 9,
                        temperature: 0.7,
                        max_tokens: 4096,
                        tags: ['reasoning', 'coding', 'analysis']
                    },
                    {
                        name: 'deepseek-chat',
                        provider: 'openai_compatible',
                        model_id: 'deepseek-chat',
                        enabled: true,
                        isCurrent: false,
                        priority: 7,
                        temperature: 0.7,
                        max_tokens: 4096,
                        tags: ['coding', 'reasoning', 'chinese']
                    }
                ];
            }
            
            if (url === '/api/performance') {
                return {
                    responseTime: [1.2, 2.3, 1.8, 3.1, 2.0],
                    cost: { daily: 2.45, monthly: 67.89 }
                };
            }
            
            // 模拟成功响应
            return { success: true };
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadOverviewData();
        });

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
